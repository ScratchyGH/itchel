<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Itchel</title>
<link rel="stylesheet" href="style.css">
<style>
.page-404 {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
text-align: center;
padding: 20px;
}
.four-oh-four {
max-width: 380px;
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
}
.logo-small {
display: inline-flex;
align-items: center;
gap: 8px;
text-decoration: none;
margin-bottom: 6px;
}
.logo-small .mark {
width: 28px;
height: 28px;
background: var(--accent);
border-radius: 7px;
display: flex;
align-items: center;
justify-content: center;
}
.logo-small .mark svg {
width: 15px;
height: 15px;
fill: white;
}
.logo-small span {
font-size: 15px;
font-weight: 700;
color: #fff;
}
.code {
font-size: 100px;
font-weight: 700;
letter-spacing: -4px;
line-height: 1;
color: var(--accent);
animation: flicker 4s infinite;
}
@keyframes flicker {
0%, 100% { opacity: 1; }
41% { opacity: 1; }
42% { opacity: 0.4; }
43% { opacity: 1; }
45% { opacity: 0.2; }
46% { opacity: 1; }
72% { opacity: 1; }
73% { opacity: 0.5; }
74% { opacity: 1; }
}
.label {
font-size: 16px;
font-weight: 600;
color: var(--text);
}
.desc {
font-size: 13px;
color: var(--muted);
line-height: 1.6;
}
.btn-home {
display: inline-flex;
align-items: center;
gap: 8px;
background: var(--accent);
color: #fff;
border: none;
border-radius: 8px;
font-size: 14px;
font-weight: 600;
padding: 11px 22px;
cursor: pointer;
text-decoration: none;
transition: background 0.15s, transform 0.1s;
margin-top: 6px;
}
.btn-home:hover { background: #e54545; }
.btn-home:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="page-404">
<div class="four-oh-four">
<a href="https://scratchygh.github.io/itchel/" class="logo-small">
<div class="mark">
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 6.5C4 5.1 5.1 4 6.5 4h11C18.9 4 20 5.1 20 6.5v.4C20 8 19.3 8.9 18.3 9.3V16c0 2.2-1.8 4-4 4H9.7C7.5 20 5.7 18.2 5.7 16V9.3C4.7 8.9 4 8 4 6.9V6.5zM9 11v4h6v-4H9z"/>
</svg>
</div>
<span>Itchel</span>
</a>
<div class="code">404</div>
<div class="label">Page not found</div>
<div class="desc">This page doesn't exist. Head back and try downloading a game.</div>
<a href="https://scratchygh.github.io/itchel/" class="btn-home">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
<polyline points="9 22 9 12 15 12 15 22"/>
</svg>
Back to Itchel
</a>
</div>
</div>
</body>
</html>
